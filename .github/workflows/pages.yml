name: Approved Pages Reader
on:
  workflow_dispatch:
  push:
    branches: [pages-approved]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-reader
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_STATIC_READER: "true"
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed source on first run
        run: |
          if [ ! -f package.json ]; then
            echo "bf0b8d915a8e1a1469c13d8f37f1d11e941dc9379aa0cec08c8e82cd44bd0dff  source-bundle.zip" | sha256sum --check
            python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('source-bundle.zip') as archive:
              for item in archive.infolist():
                  path=Path(item.filename)
                  if not path.parts or path.parts[0]!='espresso-v2':
                      raise ValueError('Unexpected archive root')
                  rel=Path(*path.parts[1:])
                  if '..' in rel.parts or rel.is_absolute():
                      raise ValueError('Unsafe archive path')
                  if not rel.parts or rel.parts[0]=='.github' or item.is_dir():
                      continue
                  rel.parent.mkdir(parents=True,exist_ok=True)
                  rel.write_bytes(archive.read(item))
          PYCODE
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add . ':!.github' ':!source-bundle.zip'
            git commit -m 'Import reviewed 9Floor V2 source'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed recipe reader
        id: deployment
        uses: actions/deploy-pages@v4
